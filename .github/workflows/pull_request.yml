name: Pull request

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  breaking:
    name: Breaking
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make breaking

  pull-request:
    name: Pull request success
    needs: [build, breaking]
    # A skipped required check reads as passing, so this runs and fails instead.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: needs.build.result != 'success' || needs.breaking.result != 'success'
        run: exit 1
