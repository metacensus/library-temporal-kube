name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: .bin
          key: tools-${{ runner.os }}-${{ hashFiles('tools/go.sum', 'tools/go.mod', 'Makefile') }}
      - name: Install twf
        run: |
          curl -sSfL https://raw.githubusercontent.com/jmbarzee/temporal-architect-dist/main/packages/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        env:
          VERSION: v0.15.0
      - run: make check
      - name: No untracked files
        run: git status --porcelain | tee /dev/stderr | test -z "$(cat)"
