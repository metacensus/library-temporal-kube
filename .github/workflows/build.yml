name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/cache@v4
        with:
          path: .bin
          key: tools-${{ runner.os }}-${{ hashFiles('tools/go.sum', 'tools/go.mod', 'Makefile') }}
      # Must match startK3s's image. Its own step, so a registry failure isn't read as a test failure.
      - run: docker pull rancher/k3s:v1.31.4-k3s1
      - run: make check
      - name: No untracked files
        run: git status --porcelain | tee /dev/stderr | test -z "$(cat)"
